<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleek Type - Speed Test</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <div class="header">
            <div class="logo">sleektype</div>
            <div class="stats-container">
                <div class="stat-box">time: <span id="timer" class="stat-value">30</span>s</div>
                <div class="stat-box">wpm: <span id="wpm" class="stat-value">0</span></div>
                <div class="stat-box">accuracy: <span id="accuracy" class="stat-value">100</span>%</div>
            </div>
        </div>

        <div class="typing-card" id="typing-card">
            <input type="text" id="hidden-input" autocomplete="off" autofocus>
            <div class="words-wrapper" id="words-container"></div>
            <div class="focus-error">Click here or press any key to focus</div>
        </div>

        <div class="controls">
            <button class="btn-restart" id="btn-restart">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67" />
                </svg>
                Restart Test
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
